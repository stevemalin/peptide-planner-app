name: Peptide Planner CI

on:
  push:
    branches: [ main, 'develop/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install root test dependencies
        run: npm ci
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Unit and engine tests
        run: npm test
      - name: TypeScript
        working-directory: app
        run: npx tsc --noEmit
      - name: Expo dependency check
        working-directory: app
        run: npx expo install --check
      - name: Expo Doctor
        working-directory: app
        run: npx expo-doctor
